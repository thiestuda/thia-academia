<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treino Log</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#121314; --surface:#1c1d20; --accent:#d4ff3f; --text:#f2f1ed; --text-dim:#8b8d93; --done:#c9a227; }
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; margin:0; padding-bottom:100px; }
  #app{max-width:520px;margin:0 auto;padding:16px;}
  .topbar{display:flex;justify-content:space-between;margin-bottom:14px;}
  .wchip{ display:inline-block; padding:8px 16px; margin-right:8px; border-radius:100px; background:var(--surface); color:var(--text-dim); cursor:pointer; }
  .wchip.active{ background:var(--text); color:var(--bg); }
  .ex-card{ background:var(--surface); padding:14px; border-radius:14px; margin-bottom:10px; }
  .timer-bar{ position:fixed; bottom:0; width:100%; background:var(--bg); border-top:2px solid var(--accent); padding:15px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// AQUI ESTÃO OS SEUS 5 DIAS ORIGINAIS
function getFullWorkouts() {
  return [
    { name:'Day 1 · Superior', exercises: [{name:'Supino Reto', muscle:'Peito', sets:4, reps:10}, {name:'Puxada Aberta', muscle:'Costas', sets:4, reps:10}, {name:'Remada Serrote', muscle:'Costas', sets:4, reps:10}, {name:'Crucifixo Máquina', muscle:'Peito', sets:4, reps:10}, {name:'Elevação Lateral', muscle:'Ombro', sets:4, reps:10}, {name:'Rosca Scott', muscle:'Bíceps', sets:4, reps:10}, {name:'Tríceps Corda', muscle:'Tríceps', sets:4, reps:10}, {name:'Abd Polia', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Infra', muscle:'Abdômen', sets:4, reps:10}, {name:'Prancha', muscle:'Abdômen', sets:4, reps:30}] },
    { name:'Day 2 · Inferior', exercises: [{name:'Leg Press 45', muscle:'Perna', sets:4, reps:10}, {name:'Terra Smith', muscle:'Perna', sets:4, reps:10}, {name:'Stiff Barra', muscle:'Perna', sets:4, reps:10}, {name:'Cadeira Extensora', muscle:'Perna', sets:4, reps:10}, {name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10}, {name:'Ext. Quadril Polia', muscle:'Glúteo', sets:4, reps:10}, {name:'Cadeira Adutora', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Leg', muscle:'Perna', sets:4, reps:10}, {name:'Abd Máquina', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Solo', muscle:'Abdômen', sets:4, reps:10}] },
    { name:'Day 3 · Empurrar', exercises: [{name:'Supino Inclinado', muscle:'Peito', sets:4, reps:10}, {name:'Supino Reto Máq', muscle:'Peito', sets:4, reps:10}, {name:'Supino Declinado', muscle:'Peito', sets:4, reps:10}, {name:'Crucifixo Média', muscle:'Peito', sets:4, reps:10}, {name:'Crucifixo Alta', muscle:'Peito', sets:4, reps:10}, {name:'Face Pull', muscle:'Ombro', sets:4, reps:10}, {name:'Elev. Lateral Polia', muscle:'Ombro', sets:4, reps:10}, {name:'Tríceps Barra', muscle:'Tríceps', sets:4, reps:10}, {name:'Abd Russo', muscle:'Abdômen', sets:4, reps:10}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10}] },
    { name:'Day 4 · Puxar', exercises: [{name:'Remada Curvada', muscle:'Costas', sets:4, reps:10}, {name:'Remada Aberta', muscle:'Costas', sets:4, reps:10}, {name:'Puxada por Trás', muscle:'Costas', sets:4, reps:10}, {name:'Puxada Triângulo', muscle:'Costas', sets:4, reps:10}, {name:'Pullover', muscle:'Costas', sets:4, reps:10}, {name:'Desenv. Máq', muscle:'Ombro', sets:4, reps:10}, {name:'Desenv. Neutro', muscle:'Ombro', sets:4, reps:10}, {name:'Rosca Direta', muscle:'Bíceps', sets:4, reps:10}, {name:'Encolhimento', muscle:'Trapézio', sets:4, reps:10}, {name:'Ext. Punho', muscle:'Antebraço', sets:4, reps:10}] },
    { name:'Day 5 · Pernas', exercises: [{name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10}, {name:'Terra Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Avanço Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Stiff Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Mesa Flexora', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Sentado', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Smith', muscle:'Perna', sets:4, reps:10}, {name:'Abdução Quadril', muscle:'Glúteo', sets:4, reps:10}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Polia Pé', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Infra Paralela', muscle:'Abdômen', sets:4, reps:10}] }
  ];
}

let state = { workouts: [], activeIdx: 0 };

function init() {
  const saved = localStorage.getItem('treino-data');
  state.workouts = saved ? JSON.parse(saved) : getFullWorkouts();
  render();
}

function render() {
  const current = state.workouts[state.activeIdx];
  const chips = state.workouts.map((w,i) => `<div class="wchip ${i===state.activeIdx?'active':''}" onclick="state.activeIdx=${i};render()">${w.name}</div>`).join('');
  const cards = current.exercises.map(ex => `<div class="ex-card"><div class="ex-name">${ex.name}</div><div class="ex-target">${ex.muscle} · ${ex.sets}x${ex.reps}</div></div>`).join('');
  
  document.getElementById('app').innerHTML = `<div class="topbar"><h1>TreinoLog</h1></div><div class="chip-row">${chips}</div><h2>${current.name}</h2>${cards}`;
}
init();
</script>
</body>
</html>
