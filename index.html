<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#121314; --surface:#1c1d20; --surface-2:#232427; --border:#2c2e33; --text:#f2f1ed; --text-dim:#8b8d93; --accent:#d4ff3f; --accent-dim:#8a9b2c; --done:#c9a227; --danger:#c4453a; --radius:14px; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding-bottom:110px; }
  h1,h2{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  #app{max-width:520px;margin:0 auto;padding:16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{ border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600; font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer; }
  .view-toggle button.active{background:var(--accent);color:#14150f;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .wchip{ flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface); border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap; }
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .ex-card{ background:var(--surface);border:1px solid var(--border);border-radius:var(--radius); padding:14px;margin-bottom:10px; }
  .ex-name{font-family:'Oswald';font-size:15.5px;font-weight:600;}
  .ex-target{color:var(--text-dim);font-size:12px;margin-top:3px;}
  .btn{ border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer; }
  .btn-primary{background:var(--accent);color:#14150f;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const storage = {
  async get(key) { if (typeof window.storage !== 'undefined') return await window.storage.get(key); return { value: localStorage.getItem(key) }; },
  async set(key, value) { if (typeof window.storage !== 'undefined') return await window.storage.set(key, value); localStorage.setItem(key, value); }
};

let state = { workouts: [], activeWorkoutId: null };

function getFullWorkouts() {
  return [
    { id: 'd1', name:'Day 1 · Superior', exercises: [ {name:'Supino Reto com Barra', muscle:'Peito', sets:4, reps:10}, {name:'Puxada Aberta', muscle:'Costas', sets:4, reps:10}, {name:'Remada Serrote', muscle:'Costas', sets:4, reps:10}, {name:'Crucifixo Peitoral Máquina', muscle:'Peito', sets:4, reps:10}, {name:'Elevação Lateral', muscle:'Ombro', sets:4, reps:10}, {name:'Rosca Scott', muscle:'Bíceps', sets:4, reps:10}, {name:'Tríceps Corda', muscle:'Tríceps', sets:4, reps:10}, {name:'Abd Polia', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Infra', muscle:'Abdômen', sets:4, reps:10}, {name:'Prancha', muscle:'Abdômen', sets:4, reps:30} ] },
    { id: 'd2', name:'Day 2 · Inferior', exercises: [ {name:'Leg Press 45', muscle:'Perna', sets:4, reps:10}, {name:'Terra Smith', muscle:'Perna', sets:4, reps:10}, {name:'Stiff Barra', muscle:'Perna', sets:4, reps:10}, {name:'Cadeira Extensora', muscle:'Perna', sets:4, reps:10}, {name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10}, {name:'Extensão Quadril Polia', muscle:'Glúteo', sets:4, reps:10}, {name:'Cadeira Adutora', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Leg Press', muscle:'Perna', sets:4, reps:10}, {name:'Abd Máquina', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Solo', muscle:'Abdômen', sets:4, reps:10} ] },
    { id: 'd3', name:'Day 3 · Empurrar', exercises: [ {name:'Supino Inclinado', muscle:'Peito', sets:4, reps:10}, {name:'Supino Reto Máquina', muscle:'Peito', sets:4, reps:10}, {name:'Supino Declinado', muscle:'Peito', sets:4, reps:10}, {name:'Crucifixo Média', muscle:'Peito', sets:4, reps:10}, {name:'Crucifixo Alta', muscle:'Peito', sets:4, reps:10}, {name:'Face Pull', muscle:'Ombro', sets:4, reps:10}, {name:'Elev. Lateral Polia', muscle:'Ombro', sets:4, reps:10}, {name:'Tríceps Barra Reta', muscle:'Tríceps', sets:4, reps:10}, {name:'Abd Russo', muscle:'Abdômen', sets:4, reps:10}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10} ] },
    { id: 'd4', name:'Day 4 · Puxar', exercises: [ {name:'Remada Curvada', muscle:'Costas', sets:4, reps:10}, {name:'Remada Aberta', muscle:'Costas', sets:4, reps:10}, {name:'Puxada por Trás', muscle:'Costas', sets:4, reps:10}, {name:'Puxada Triângulo', muscle:'Costas', sets:4, reps:10}, {name:'Pullover Halteres', muscle:'Costas', sets:4, reps:10}, {name:'Desenv. Máquina', muscle:'Ombro', sets:4, reps:10}, {name:'Desenv. Neutro', muscle:'Ombro', sets:4, reps:10}, {name:'Rosca Direta', muscle:'Bíceps', sets:4, reps:10}, {name:'Encolhimento Smith', muscle:'Trapézio', sets:4, reps:10}, {name:'Ext. Punho', muscle:'Antebraço', sets:4, reps:10} ] },
    { id: 'd5', name:'Day 5 · Pernas', exercises: [ {name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10}, {name:'Terra Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Avanço Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Stiff Halteres', muscle:'Perna', sets:4, reps:10}, {name:'Mesa Flexora', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Sentado', muscle:'Perna', sets:4, reps:10}, {name:'Panturrilha Smith', muscle:'Perna', sets:4, reps:10}, {name:'Abdução Quadril', muscle:'Glúteo', sets:4, reps:10}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Polia Pé', muscle:'Abdômen', sets:4, reps:10}, {name:'Abd Infra Paralela', muscle:'Abdômen', sets:4, reps:10} ] }
  ];
}

async function loadData(){
  const res = await storage.get('app-data');
  if(res && res.value){
    const parsed = JSON.parse(res.value);
    // Preserva o que já existe, mas se estiver vazio, coloca os 5 dias
    state.workouts = (parsed.workouts && parsed.workouts.length > 0) ? parsed.workouts : getFullWorkouts();
  } else {
    state.workouts = getFullWorkouts();
    await storage.set('app-data', JSON.stringify({workouts: state.workouts}));
  }
  state.activeWorkoutId = state.workouts[0].id;
  render();
}

function render(){
  const wk = state.workouts.find(w => w.id === state.activeWorkoutId);
  const chips = state.workouts.map(w => `<div class="wchip ${w.id===state.activeWorkoutId ? 'active':''}" onclick="state.activeWorkoutId='${w.id}';render()">${w.name}</div>`).join('');
  const cards = wk.exercises.map(ex => `
    <div class="ex-card">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-target">${ex.muscle} · ${ex.sets}x${ex.reps}</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="topbar"><h1>Treino<span>Log</span></h1></div>
    <div class="chip-row">${chips}</div>
    <h2>${wk.name}</h2>
    ${cards}
  `;
}
loadData();
</script>
</body>
</html>
