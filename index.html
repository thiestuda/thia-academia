<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treino Log</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Configurações PWA prontas para iOS/Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Log">

<!-- Manifesto embutido via Data URI -->
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Treino%20Log%22,%22short_name%22:%22Treino%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121314%22,%22theme_color%22:%22%23121314%22}">

<style>
  :root{
    --bg:#121314;
    --surface:#1c1d20;
    --surface-2:#232427;
    --border:#2c2e33;
    --text:#f2f1ed;
    --text-dim:#8b8d93;
    --accent:#d4ff3f;
    --accent-dim:#8a9b2c;
    --done:#c9a227;
    --danger:#c4453a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:110px;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  #app{max-width:520px;margin:0 auto;padding:16px;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h1{font-size:22px;margin:0;color:var(--text);}
  .topbar h1 span{color:var(--accent);}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{
    border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600;
    font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer;
  }

  /* workout chips */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .wchip{
    flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface);
    border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  /* muscle heat strip */
  .muscle-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .mtag{
    font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:7px;text-transform:uppercase;
    letter-spacing:0.02em;opacity:0.35;border:1px solid transparent;
  }
  .mtag.lit{opacity:1;background:var(--surface-2);}

  /* workout header row */
  .wk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .wk-header h2{font-size:19px;margin:0;}
  .wk-meta{color:var(--text-dim);font-size:12px;margin-top:2px;font-family:'Inter';text-transform:none;letter-spacing:0;}
  
  .btn{
    border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';
  }
  .btn-primary{background:var(--accent);color:#14150f;}
  .btn-sm{padding:6px 11px;font-size:11px;border-radius:8px;}

  /* exercise list card */
  .ex-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px;margin-bottom:10px;cursor:pointer; display:flex; flex-direction:column;
    transition: background 0.2s;
  }
  .ex-card:active { background:var(--surface-2); }
  .ex-card-main { display:flex; gap:12px; align-items:center; width:100%; }
  .ex-thumb {
    width: 60px; height: 60px; border-radius: 8px; background-color: var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-weight:bold; color:var(--text-dim);
  }
  .ex-info { flex: 1; }
  .ex-name{font-family:'Oswald';font-size:15.5px;text-transform:none;letter-spacing:0;font-weight:600;}
  .ex-idx{color:var(--text-dim);font-size:12px;font-weight:700;margin-right:7px;}
  .ex-target{color:var(--text-dim);font-size:11px;margin-top:4px; line-height:1.4;}
  .ex-equip{color:var(--accent);font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:0.05em;margin-top:2px;}
  .ex-status { font-size: 11px; font-weight:700; padding:4px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-dim); }

  /* Detalhes do Exercício */
  .ex-detail-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .btn-back { background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:100px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:bold; border:1px solid var(--border); }
  
  /* Sets Grid Dinâmica */
  .setgrid{display:flex;flex-direction:column;gap:7px; margin-bottom: 24px;}
  .setrow{display:grid;grid-template-columns:28px 1fr 1fr 42px;gap:7px;align-items:center;}
  .setrow .slabel{color:var(--text-dim);font-size:12px;font-weight:700; text-align:center;}
  .setrow input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:12px 6px;font-size:15px;text-align:center;font-family:'Inter';font-weight:600;
  }
  .setrow input:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  .donebtn{
    width:42px;height:42px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-dim);font-size:16px;cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center;
  }
  .donebtn.done{background:var(--done);color:#181400;border-color:var(--done);}

  .finish-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:12px 16px;display:flex;gap:10px; z-index:10;
  }
  .finish-bar .btn{flex:1;}

  .add-ex-form{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-top:2px;}
  .add-ex-form input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:8px;font-family:'Inter';
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <!-- TELA PRINCIPAL (LISTA DE EXERCÍCIOS) -->
  <div id="main-view">
    <div class="topbar">
      <h1>Treino<span>Log</span></h1>
      <div class="view-toggle"><button class="active">Treinar</button></div>
    </div>

    <div class="chip-row">
      <div class="wchip active">Treino A</div>
    </div>

    <div class="muscle-strip">
      <span class="mtag lit">Peito</span>
      <span class="mtag lit">Tríceps</span>
    </div>

    <div class="wk-header">
      <div>
        <h2 id="wk-title">Meu Treino</h2>
        <div class="wk-meta">Carregando treino local...</div>
      </div>
    </div>

    <div id="exercise-list"></div>

    <div class="add-ex-form">
      <h3 style="margin-top:0; font-size:13px; color:var(--text-dim);">Novo Exercício</h3>
      <input type="text" id="ex-name-input" placeholder="Nome (Ex: Supino Reto)">
      <input type="text" id="ex-target-input" placeholder="Músculos (Ex: Peito, Tríceps)">
      <input type="text" id="ex-equip-input" placeholder="Equipamento (Ex: Barra)">
      <button class="btn btn-primary btn-sm" onclick="salvarExercicioNoCache()">Adicionar à Lista</button>
    </div>
  </div>

  <!-- TELA DE DETALHES (GRADE DE SÉRIES DE CADA EXERCÍCIO) -->
  <div id="detail-view" class="hidden">
    <div class="ex-detail-header">
      <button class="btn-back" onclick="voltarParaLista()">←</button>
      <div>
        <h2 id="detail-ex-name" style="margin:0; font-size:20px;">Nome do Exercício</h2>
        <div id="detail-ex-meta" style="font-size:12px; color:var(--text-dim);">Alvo</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:28px 1fr 1fr 42px; gap:7px; margin-bottom:8px; padding:0 2px;">
      <span style="font-size:10px; font-weight:700; color:var(--text-dim); text-align:center;">SET</span>
      <span style="font-size:10px; font-weight:700; color:var(--text-dim); text-align:center;">KG</span>
      <span style="font-size:10px; font-weight:700; color:var(--text-dim); text-align:center;">REPS</span>
      <span style="font-size:10px; font-weight:700; color:var(--text-dim); text-align:center;">STATUS</span>
    </div>

    <div class="setgrid" id="set-grid-container">
      <!-- As séries estruturadas aparecem de forma dinâmica via JavaScript aqui -->
    </div>
  </div>
</div>

<div class="finish-bar">
  <button class="btn btn-primary" onclick="limparProgressoTreino()">Resetar/Iniciar Novo Treino</button>
</div>

<script>
  // Inicialização com dados padrão caso o cache esteja vazio
  const dadosPadrao = [
    { nome: "Supino Reto", alvo: "Peitorais, Tríceps", equip: "Barra", sets: [ {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false} ] },
    { nome: "Agachamento Livre", alvo: "Quadríceps, Glúteos", equip: "Barra", sets: [ {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false} ] }
  ];

  let meusTreinos = JSON.parse(localStorage.getItem('meusTreinos')) || dadosPadrao;
  let exercicioAtivoIndex = null;

  if(!localStorage.getItem('meusTreinos')) {
    localStorage.setItem('meusTreinos', JSON.stringify(meusTreinos));
  }

  function renderizarExercicios() {
    const container = document.getElementById('exercise-list');
    container.innerHTML = '';
    
Use o código com cuidado.meusTreinos.forEach((ex, idx) => {const concluídas = ex.sets.filter(s => s.done).length;container.innerHTML += <div class="ex-card" onclick="abrirDetalhesExercício(${idx})"> <div class="ex-card-main"> <div class="ex-thumb">${String(idx + 1).padStart(2, '0')}</div> <div class="ex-info"> <div class="ex-name">${ex.nome}</div> <div class="ex-target">${ex.alvo}</div> <div class="ex-equip">${ex.equip}</div> </div> <div class="ex-status">${concluídas}/${ex.sets.length} SÉRIES</div> </div> </div>;});document.querySelector('.wk-meta').innerText = ${meusTreinos.length} Exercícios salvos localmente;}function salvarExercicioNoCache() {const nome = document.getElementById('ex-name-input').value;const alvo = document.getElementById('ex-target-input').value;const equip = document.getElementById('ex-equip-input').value;if(!nome) return alert('Por favor, insira o nome do exercício!');meusTreinos.push({nome: nome,alvo: alvo || "Geral",equip: equip || "Livre",sets: [ {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false}, {kg:"", reps:"", done:false} ]});atualizarCacheGeral();renderizarExercicios();document.getElementById('ex-name-input').value = '';document.getElementById('ex-target-input').value = '';document.getElementById('ex-equip-input').value = '';}function abrirDetalhesExercício(index) {exercicioAtivoIndex = index;const ex = meusTreinos[index];document.getElementById('detail-ex-name').innerText = ex.nome;document.getElementById('detail-ex-meta').innerText = ${ex.equip} • ${ex.alvo};montarGradeDeSeries(ex);document.getElementById('main-view').classList.add('hidden');document.getElementById('detail-view').classList.remove('hidden');}function montarGradeDeSeries(ex) {const gridContainer = document.getElementById('set-grid-container');gridContainer.innerHTML = '';ex.sets.forEach((set, sIdx) => {gridContainer.innerHTML += <div class="setrow"> <div class="slabel tabular">${sIdx + 1}</div> <input type="number" inputmode="decimal" id="kg-${sIdx}" placeholder="--" value="${set.kg}" onchange="salvarMudancaInput(${sIdx}, 'kg', this.value)"> <input type="number" inputmode="numeric" id="reps-${sIdx}" placeholder="--" value="${set.reps}" onchange="salvarMudancaInput(${sIdx}, 'reps', this.value)"> <button class="donebtn ${set.done ? 'done' : ''}" onclick="alternarEstadoSerie(${sIdx})">${set.done ? '✓' : ''}</button> </div>;});}function salvarMudancaInput(setIndex, campo, valor) {meusTreinos[exercicioAtivoIndex].sets[setIndex][campo] = valor;atualizarCacheGeral();}function alternarEstadoSerie(setIndex) {const estadoAtual = meusTreinos[exercicioAtivoIndex].sets[setIndex].done;meusTreinos[exercicioAtivoIndex].sets[setIndex].done = !estadoAtual;atualizarCacheGeral();montarGradeDeSeries(meusTreinos[exercicioAtivoIndex]);}function voltarParaLista() {document.getElementById('detail-view').classList.add('hidden');document.getElementById('main-view').classList.remove('hidden');renderizarExercicios();}function atualizarCacheGeral() {localStorage.setItem('meusTreinos', JSON.stringify(meusTreinos));}function limparProgressoTreino() {if(confirm("Deseja limpar os pesos e checks para iniciar um treino limpo?")) {meusTreinos.forEach(ex => {ex.sets.forEach(set => {set.kg = "";set.reps = "";set.done = false;});});atualizarCacheGeral();renderizarExercicios();alert("Status do treino reiniciado!");}}window.onload = renderizarExercicios;// --- SERVICE WORKER AUTOMÁTICO PARA SUPORTE OFFLINE ---if ('serviceWorker' in navigator) {const swCode = const CACHE_NAME = 'treino-log-v2'; self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['/', 'index.html']))); }); self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request))); });;const blob = new Blob([swCode], { type: 'application/javascript' });navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: '/' });}
