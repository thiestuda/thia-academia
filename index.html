<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treino Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#121314; --surface:#1c1d20; --surface-2:#232427; --border:#2c2e33; --text:#f2f1ed; --text-dim:#8b8d93; --accent:#d4ff3f; --accent-dim:#8a9b2c; --done:#c9a227; --danger:#c4453a; --radius:14px; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; padding-bottom:110px; }
  h1,h2{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  #app{max-width:520px;margin:0 auto;padding:16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{ border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600; font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer; }
  .view-toggle button.active{background:var(--accent);color:#14150f;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .wchip{ flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface); border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap; }
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .ex-card{ background:var(--surface);border:1px solid var(--border);border-radius:var(--radius); padding:14px;margin-bottom:10px; cursor:pointer; }
  .ex-name{font-family:'Oswald';font-size:15.5px;font-weight:600;}
  .ex-target{color:var(--text-dim);font-size:12px;margin-top:3px;}
  .setgrid{display:flex;flex-direction:column;gap:7px; margin-top:12px;}
  .setrow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:7px;align-items:center;}
  .donebtn{ width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2); color:var(--text-dim);cursor:pointer; }
  .donebtn.done{background:var(--done);color:#181400;border-color:var(--done);}
  .timer-bar{ position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--accent); padding:14px 18px;display:flex;align-items:center;gap:16px;z-index:20; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const storage = {
  async get(key) { if (typeof window.storage !== 'undefined') return await window.storage.get(key); return { value: localStorage.getItem(key) }; },
  async set(key, value) { if (typeof window.storage !== 'undefined') return await window.storage.set(key, value); localStorage.setItem(key, value); }
};

let state = { workouts: [], activeWorkoutId: null, session: null };

function getFullWorkouts() {
  return [
    { id: 'd1', name:'Day 1 · Superior', exercises: [ {name:'Supino Reto com Barra', muscle:'Peito', sets:4, reps:10, rest:90}, {name:'Puxada Aberta', muscle:'Costas', sets:4, reps:10, rest:90}, {name:'Remada Serrote', muscle:'Costas', sets:4, reps:10, rest:75}, {name:'Crucifixo Máquina', muscle:'Peito', sets:4, reps:10, rest:60}, {name:'Elevação Lateral', muscle:'Ombro', sets:4, reps:10, rest:45}, {name:'Rosca Scott', muscle:'Bíceps', sets:4, reps:10, rest:60}, {name:'Tríceps Corda', muscle:'Tríceps', sets:4, reps:10, rest:60}, {name:'Abd Polia', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Abd Infra', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Prancha', muscle:'Abdômen', sets:4, reps:30, rest:30} ] },
    { id: 'd2', name:'Day 2 · Inferior', exercises: [ {name:'Leg Press 45', muscle:'Perna', sets:4, reps:10, rest:90}, {name:'Terra Smith', muscle:'Perna', sets:4, reps:10, rest:120}, {name:'Stiff Barra', muscle:'Perna', sets:4, reps:10, rest:90}, {name:'Cadeira Extensora', muscle:'Perna', sets:4, reps:10, rest:60}, {name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10, rest:60}, {name:'Extensão Quadril Polia', muscle:'Glúteo', sets:4, reps:10, rest:45}, {name:'Cadeira Adutora', muscle:'Perna', sets:4, reps:10, rest:45}, {name:'Panturrilha Leg', muscle:'Perna', sets:4, reps:10, rest:45}, {name:'Abd Máquina', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Abd Solo', muscle:'Abdômen', sets:4, reps:10, rest:30} ] },
    { id: 'd3', name:'Day 3 · Empurrar', exercises: [ {name:'Supino Inclinado', muscle:'Peito', sets:4, reps:10, rest:90}, {name:'Supino Reto Máquina', muscle:'Peito', sets:4, reps:10, rest:90}, {name:'Supino Declinado', muscle:'Peito', sets:4, reps:10, rest:75}, {name:'Crucifixo Média', muscle:'Peito', sets:4, reps:10, rest:60}, {name:'Crucifixo Alta', muscle:'Peito', sets:4, reps:10, rest:60}, {name:'Face Pull', muscle:'Ombro', sets:4, reps:10, rest:60}, {name:'Elev. Lateral Polia', muscle:'Ombro', sets:4, reps:10, rest:45}, {name:'Tríceps Barra Reta', muscle:'Tríceps', sets:4, reps:10, rest:60}, {name:'Abd Russo', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10, rest:30} ] },
    { id: 'd4', name:'Day 4 · Puxar', exercises: [ {name:'Remada Curvada', muscle:'Costas', sets:4, reps:10, rest:90}, {name:'Remada Aberta', muscle:'Costas', sets:4, reps:10, rest:75}, {name:'Puxada por Trás', muscle:'Costas', sets:4, reps:10, rest:75}, {name:'Puxada Triângulo', muscle:'Costas', sets:4, reps:10, rest:60}, {name:'Pullover Halteres', muscle:'Costas', sets:4, reps:10, rest:60}, {name:'Desenv. Máquina', muscle:'Ombro', sets:4, reps:10, rest:75}, {name:'Desenv. Neutro', muscle:'Ombro', sets:4, reps:10, rest:60}, {name:'Rosca Direta', muscle:'Bíceps', sets:4, reps:10, rest:60}, {name:'Encolhimento Smith', muscle:'Trapézio', sets:4, reps:10, rest:45}, {name:'Ext. Punho', muscle:'Antebraço', sets:4, reps:10, rest:30} ] },
    { id: 'd5', name:'Day 5 · Pernas', exercises: [ {name:'Elevação Pélvica', muscle:'Glúteo', sets:4, reps:10, rest:120}, {name:'Terra Halteres', muscle:'Perna', sets:4, reps:10, rest:90}, {name:'Avanço Halteres', muscle:'Perna', sets:4, reps:10, rest:75}, {name:'Stiff Halteres', muscle:'Perna', sets:4, reps:10, rest:75}, {name:'Mesa Flexora', muscle:'Perna', sets:4, reps:10, rest:60}, {name:'Panturrilha Sentado', muscle:'Perna', sets:4, reps:10, rest:45}, {name:'Panturrilha Smith', muscle:'Perna', sets:4, reps:10, rest:45}, {name:'Abdução Quadril', muscle:'Glúteo', sets:4, reps:10, rest:45}, {name:'Prancha Lateral', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Abd Polia Pé', muscle:'Abdômen', sets:4, reps:10, rest:30}, {name:'Abd Infra Paralela', muscle:'Abdômen', sets:4, reps:10, rest:30} ] }
  ];
}

async function loadData(){
  const res = await storage.get('app-data');
  if(res && res.value){
    const parsed = JSON.parse(res.value);
    state.workouts = parsed.workouts || getFullWorkouts();
  } else {
    state.workouts = getFullWorkouts();
    await storage.set('app-data', JSON.stringify({workouts: state.workouts}));
  }
  state.activeWorkoutId = state.workouts[0].id;
  render();
}

function render(){
  const wk = state.workouts.find(w => w.id === state.activeWorkoutId);
  const chips = state.workouts.map(w => `<div class="wchip ${w.id===state.activeWorkoutId ? 'active':''}" onclick="state.activeWorkoutId='${w.id}';render()">${w.name}</div>`).join('');
  const cards = wk.exercises.map(ex => `
    <div class="ex-card">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-target">${ex.muscle} · ${ex.sets}x${ex.reps} · descanso ${ex.rest}s</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="topbar"><h1>Treino<span>Log</span></h1></div>
    <div class="chip-row">${chips}</div>
    <h2>${wk.name}</h2>
    ${cards}
  `;
}
loadData();
</script>
</body>
</html>
