<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121314;
    --surface:#1c1d20;
    --surface-2:#232427;
    --border:#2c2e33;
    --text:#f2f1ed;
    --text-dim:#8b8d93;
    --accent:#d4ff3f;
    --accent-dim:#8a9b2c;
    --done:#c9a227;
    --danger:#c4453a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:110px;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  #app{max-width:520px;margin:0 auto;padding:16px;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h1{font-size:22px;margin:0;color:var(--text);}
  .topbar h1 span{color:var(--accent);}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{
    border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600;
    font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer;
  }
  .view-toggle button.active{background:var(--accent);color:#14150f;}

  /* workout chips */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .wchip{
    flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface);
    border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .wchip.add{color:var(--accent);border-color:var(--accent-dim);}

  /* muscle heat strip */
  .muscle-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .mtag{
    font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:7px;text-transform:uppercase;
    letter-spacing:0.02em;opacity:0.35;border:1px solid transparent;
  }
  .mtag.lit{opacity:1;}
  .mtag.done{outline:2px solid var(--done);outline-offset:1px;}

  /* workout header row */
  .wk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .wk-header h2{font-size:19px;margin:0;}
  .wk-meta{color:var(--text-dim);font-size:12px;margin-top:2px;font-family:'Inter';text-transform:none;letter-spacing:0;}
  .btn{
    border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';
  }
  .btn-primary{background:var(--accent);color:#14150f;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-sm{padding:6px 11px;font-size:11px;border-radius:8px;}
  .btn-row{display:flex;gap:8px;}

  /* exercise list card (novo layout) */
  .ex-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px;margin-bottom:10px;cursor:pointer; display:flex; flex-direction:column;
    transition: background 0.2s;
  }
  .ex-card:active { background:var(--surface-2); }
  .ex-card-main { display:flex; gap:12px; align-items:center; width:100%; }
  .ex-thumb {
    width: 60px; height: 60px; border-radius: 8px; background-color: var(--surface-2);
    background-size: cover; background-position: center; flex-shrink: 0;
  }
  .ex-info { flex: 1; }
  .ex-name{font-family:'Oswald';font-size:15.5px;text-transform:none;letter-spacing:0;font-weight:600;}
  .ex-idx{color:var(--text-dim);font-size:12px;font-weight:700;margin-right:7px;}
  .ex-target{color:var(--text-dim);font-size:11px;margin-top:4px; line-height:1.4;}
  .ex-equip{color:var(--accent);font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:0.05em;margin-top:2px;}
  .mdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;}
  .ex-status { font-size: 11px; font-weight:700; padding:4px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-dim); }
  .ex-status.active { background:var(--done); color:#000; }

  /* Detalhes do Exercício (Nova Tela) */
  .ex-detail-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .btn-back { background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:100px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:bold; }
  .ex-detail-img { width: 100%; height: 200px; border-radius: var(--radius); background-color: var(--surface-2); background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 16px; }
  
  /* Tabs */
  .tabs { display:flex; background:var(--surface); border-radius:10px; padding:4px; margin-bottom:16px; border:1px solid var(--border);}
  .tab { flex:1; text-align:center; padding:8px 0; font-size:12px; font-weight:600; color:var(--text-dim); cursor:pointer; border-radius:8px; }
  .tab.active { background:var(--surface-2); color:var(--text); }
  .tab-content { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; font-size:13px; line-height:1.5; color:var(--text); margin-bottom:24px; min-height:80px; }
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius:8px; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:none; }

  /* Sets Grid */
  .setgrid{display:flex;flex-direction:column;gap:7px; margin-bottom: 24px;}
  .setrow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:7px;align-items:center;}
  .setrow .slabel{color:var(--text-dim);font-size:12px;font-weight:700;}
  .setrow input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:12px 6px;font-size:15px;text-align:center;font-family:'Inter';font-weight:600;
  }
  .setrow input:focus{outline:1px solid var(--accent);}
  .setrow.active-set input { border-color:var(--accent); }
  .donebtn{
    width:42px;height:42px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-dim);font-size:18px;cursor:pointer; font-weight:bold;
  }
  .donebtn.done{background:var(--done);color:#181400;border-color:var(--done);}

  .finish-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:12px 16px;display:flex;gap:10px; z-index:10;
  }
  .finish-bar .btn{flex:1;}

  /* Forms de edição */
  .add-ex-form{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-top:6px;}
  .add-ex-form input, .add-ex-form select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:8px;font-family:'Inter';
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  /* rest timer */
  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--accent);
    padding:14px 18px;display:flex;align-items:center;gap:16px;z-index:20;
  }
  .ring{width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface-2) 0);}
  .ring-inner{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-family:'Oswald';font-size:14px;font-weight:600;}
  .timer-info{flex:1;}
  .timer-info .lbl{color:var(--text-dim);font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;}
  .timer-info .time{font-family:'Oswald';font-size:26px;line-height:1.1;}
  .timer-actions{display:flex;gap:6px;}
  .timer-actions button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;
  }

  /* history */
  .sess-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;}
  .sess-top{display:flex;justify-content:space-between;align-items:baseline;}
  .sess-date{font-family:'Oswald';font-size:15px;}
  .sess-stats{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .sess-detail{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:none;}
  .sess-detail.open{display:block;}
  .sess-ex-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-dim);}
  .sess-ex-row b{color:var(--text);font-weight:600;}
  .delta{font-weight:700;margin-left:6px;}
  .delta.up{color:#7bd88f;}
  .delta.down{color:var(--danger);}
  .delta.eq{color:var(--text-dim);}

  .empty{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:13px;}
  .section-label{color:var(--text-dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 8px;}
</style>
</head>

const safeStorage = {
  async get(key) {
    if (typeof window.storage !== 'undefined' && window.storage.get) {
      try { return await window.storage.get(key); } catch(e){}
    }
    return { value: localStorage.getItem(key) };
  },
  async set(key, value) {
    if (typeof window.storage !== 'undefined' && window.storage.set) {
      try { return await window.storage.set(key, value); } catch(e){}
    }
    localStorage.setItem(key, value);
  },
  async delete(key) {
    if (typeof window.storage !== 'undefined' && window.storage.delete) {
      try { return await window.storage.delete(key); } catch(e){}
    }
    localStorage.removeItem(key);
  }
};

const DATA_VERSION = 4;

async function loadData(){
  try{
    const res = await safeStorage.get('app-data');
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      
      // FORÇA a restauração dos treinos padrão SE eles sumiram nas versões anteriores,
      // OU mantém os novos se o usuário já tiver editado.
      if(!parsed.workouts || parsed.workouts.length === 0 || (parsed.version && parsed.version < DATA_VERSION)){
        state.workouts = defaultWorkouts();
      } else {
        state.workouts = parsed.workouts;
      }
      
      state.sessions = parsed.sessions || [];
      await saveData(); 
    } else {
      state.workouts = defaultWorkouts();
      state.sessions = [];
      await saveData();
    }
  }catch(e){
    state.workouts = defaultWorkouts();
    state.sessions = [];
  }
  state.activeWorkoutId = state.workouts[0] ? state.workouts[0].id : null;

  try{
    const cur = await safeStorage.get('current-session');
    if(cur && cur.value){
      state.session = JSON.parse(cur.value);
      state.activeWorkoutId = state.session.workoutId;
    }
  }catch(e){ }
  render();
}

async function saveData(){ await safeStorage.set('app-data', JSON.stringify({version: DATA_VERSION, workouts: state.workouts, sessions: state.sessions})); }
async function saveSession(){ if(state.session){ await safeStorage.set('current-session', JSON.stringify(state.session)); } }
async function clearSessionStorage(){ await safeStorage.delete('current-session'); }

function activeWorkout(){ return state.workouts.find(w => w.id === state.activeWorkoutId) || null; }
function musclesDoneInSession(){
  if(!state.session) return new Set();
  const wk = activeWorkout();
  if(!wk) return new Set();
  const s = new Set();
  wk.exercises.forEach(ex => {
    const entry = state.session.entries[ex.id];
    if(entry && entry.sets.some(st => st.done)) s.add(ex.muscle);
  });
  return s;
}

// ---------- Edição de Treinos ----------
function addWorkout(){
  const name = prompt('Nome do novo treino (ex: Costas e Bíceps):');
  if(!name) return;
  const wk = { id: uid(), name, exercises: [] };
  state.workouts.push(wk);
  state.activeWorkoutId = wk.id;
  state.editMode = true;
  saveData();
  render();
}
function deleteWorkout(id){
  if(!confirm('Excluir este treino permanentemente? Isso não apaga o histórico já salvo.')) return;
  state.workouts = state.workouts.filter(w => w.id !== id);
  state.activeWorkoutId = state.workouts[0] ? state.workouts[0].id : null;
  state.editMode = false;
  saveData();
  render();
}
function moveExercise(wk, idx, dir){
  const j = idx + dir;
  if(j < 0 || j >= wk.exercises.length) return;
  const tmp = wk.exercises[idx];
  wk.exercises[idx] = wk.exercises[j];
  wk.exercises[j] = tmp;
  saveData();
  render();
}
function deleteExercise(wk, idx){
  wk.exercises.splice(idx,1);
  saveData();
  render();
}
function submitAddExercise(wk){
  const name = document.getElementById('nex-name').value.trim();
  const muscle = document.getElementById('nex-muscle').value;
  const sets = Number(document.getElementById('nex-sets').value) || 4;
  const reps = Number(document.getElementById('nex-reps').value) || 10;
  const weight = Number(document.getElementById('nex-weight').value) || 0;
  const rest = Number(document.getElementById('nex-rest').value) || 60;
  if(!name){ alert('Digite um nome para o exercício.'); return; }
  
  wk.exercises.push({
    id:uid(), name, muscle, sets, reps, weight, rest, 
    equipment: 'Livre/Máquina', image: '', execution: '', video: '', unit: 'reps'
  });
  saveData();
  render();
}

function addExerciseFormHtml(){
  return `
  <div class="add-ex-form">
    <div style="margin-bottom:10px;font-size:13px;font-weight:bold;">Adicionar Novo Exercício</div>
    <input id="nex-name" placeholder="Nome do exercício">
    <div class="field-row">
      <select id="nex-muscle">${MUSCLE_LIST.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
      <input id="nex-sets" type="number" placeholder="séries" value="4">
      <input id="nex-reps" type="number" placeholder="reps" value="10">
    </div>
    <div class="field-row">
      <input id="nex-weight" type="number" placeholder="carga kg" value="0">
      <input id="nex-rest" type="number" placeholder="descanso s" value="60">
      <button class="btn btn-primary" onclick="submitAddExercise(activeWorkout())">Adicionar</button>
    </div>
  </div>`;
}

// ---------- Sessão em Andamento e Avanço Automático ----------
function startSession(wk){
  const entries = {};
  wk.exercises.forEach(ex => {
    entries[ex.id] = { sets: Array.from({length: ex.sets || 1}, () => ({weight: ex.weight, reps: ex.reps, done:false})) };
  });
  state.session = { id: uid(), workoutId: wk.id, workoutName: wk.name, startedAt: Date.now(), finishedAt: null, entries };
  state.editMode = false;
  saveSession();
  render();
}

function toggleSet(exId, setIdx){
  if(!state.session) return;
  const entry = state.session.entries[exId];
  const st = entry.sets[setIdx];
  st.done = !st.done;
  
  if(st.done){
    const wk = activeWorkout();
    const exIndex = wk.exercises.findIndex(e => e.id === exId);
    const ex = wk.exercises[exIndex];
    startTimer(ex ? (ex.rest || 60) : 60);

    const allDone = entry.sets.every(s => s.done);
    if(allDone){
      if(exIndex < wk.exercises.length - 1){
        const nextEx = wk.exercises[exIndex + 1];
        setTimeout(() => {
          if(state.view === 'exercicio' && state.activeExerciseId === exId){
            openExercise(nextEx.id);
          }
        }, 800);
      } else {
        setTimeout(() => { alert("Treino concluído! Finalize a sessão no botão abaixo."); }, 800);
      }
    }
  }
  saveSession();
  render();
}

function updateSetField(exId, setIdx, field, value){
  const st = state.session.entries[exId].sets[setIdx];
  st[field] = value === '' ? 0 : Number(value);
  saveSession();
}

async function finishSession(){
  if(!state.session) return;
  state.session.finishedAt = Date.now();
  
  const wk = activeWorkout();
  if(wk) {
    wk.exercises.forEach(ex => {
      const entry = state.session.entries[ex.id];
      if(entry) {
        const maxW = Math.max(0, ...entry.sets.filter(s=>s.done).map(s=>s.weight));
        if(maxW > 0) ex.weight = maxW;
      }
    });
  }

  state.sessions.unshift(state.session);
  if(state.sessions.length > 200) state.sessions.length = 200;
  await saveData();
  state.session = null;
  stopTimer();
  await clearSessionStorage();
  state.view = 'treino';
  render();
}

function cancelSession(){
  state.session = null; stopTimer(); clearSessionStorage(); state.view='treino'; render();
}

function openExercise(exId){
  if(state.editMode) return; 
  state.activeExerciseId = exId;
  state.activeTab = 'execucao';
  state.view = 'exercicio';
  render();
}
function closeExercise(){
  state.activeExerciseId = null;
  state.view = 'treino';
  render();
}
function setTab(tab){
  state.activeTab = tab;
  render();
}

// ---------- Timer ----------
let audioCtx = null;
function beep(freq, dur){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur/1000);
  }catch(e){ }
}
function startTimer(seconds){
  stopTimer();
  state.timer.total = seconds; state.timer.remaining = seconds; state.timer.running = true; state.timer.done = false;
  state.timer.tickHandle = setInterval(() => {
    state.timer.remaining -= 1;
    if(state.timer.remaining <= 0){
      state.timer.remaining = 0; state.timer.running = false; state.timer.done = true;
      clearInterval(state.timer.tickHandle);
      beep(880,150); setTimeout(()=>beep(880,150),220); setTimeout(()=>beep(1100,220),440);
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }
    renderTimerOnly();
  }, 1000);
  render();
}
function adjustTimer(delta){
  if(!state.timer.total && !state.timer.remaining) return;
  state.timer.remaining = Math.max(0, state.timer.remaining + delta);
  state.timer.total = Math.max(state.timer.total, state.timer.remaining);
  renderTimerOnly();
}
function togglePauseTimer(){
  if(state.timer.done) return;
  if(state.timer.running){ state.timer.running = false; clearInterval(state.timer.tickHandle); } 
  else if(state.timer.remaining > 0){
    state.timer.running = true;
    state.timer.tickHandle = setInterval(() => {
      state.timer.remaining -= 1;
      if(state.timer.remaining <= 0){
        state.timer.remaining = 0; state.timer.running = false; state.timer.done = true;
        clearInterval(state.timer.tickHandle);
        beep(880,150); setTimeout(()=>beep(880,150),220); setTimeout(()=>beep(1100,220),440);
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
      renderTimerOnly();
    }, 1000);
  }
  renderTimerOnly();
}
function stopTimer(){ if(state.timer.tickHandle) clearInterval(state.timer.tickHandle); state.timer = { running:false, remaining:0, total:0, tickHandle:null, done:false }; }
function dismissTimer(){ stopTimer(); render(); }

// ---------- Views ----------
function renderTimerOnly(){
  const el = document.getElementById('timer-slot');
  if(el) el.innerHTML = timerBarHtml();
  attachTimerEvents();
}
function attachTimerEvents(){
  document.querySelectorAll('[data-timer-action]').forEach(btn=>{
    btn.onclick = () => {
      const act = btn.getAttribute('data-timer-action');
      if(act==='minus') adjustTimer(-15);
      if(act==='plus') adjustTimer(15);
      if(act==='pause') togglePauseTimer();
      if(act==='dismiss') dismissTimer();
    };
  });
}

function timerBarHtml(){
  if(!state.timer.total && !state.timer.remaining && !state.timer.done) return '';
  const pct = state.timer.total ? Math.round(100 * (state.timer.total - state.timer.remaining) / state.timer.total) : 100;
  const mm = String(Math.floor(state.timer.remaining/60)).padStart(2,'0');
  const ss = String(state.timer.remaining%60).padStart(2,'0');
  const label = state.timer.done ? 'Descanso concluído' : (state.timer.running ? 'Descansando' : 'Pausado');
  return `
  <div class="timer-bar">
    <div class="ring" style="--pct:${pct}"><div class="ring-inner tabular">${mm}:${ss}</div></div>
    <div class="timer-info"><div class="lbl">${label}</div><div class="time tabular">${mm}:${ss}</div></div>
    <div class="timer-actions">
      ${state.timer.done ? `<button data-timer-action="dismiss">OK</button>` : `
      <button data-timer-action="minus">-15</button>
      <button data-timer-action="pause">${state.timer.running ? 'Pausar' : 'Retomar'}</button>
      <button data-timer-action="plus">+15</button>
      <button data-timer-action="dismiss">Pular</button>`}
    </div>
  </div>`;
}

// VIEW 1: LISTA DO TREINO
function treinoViewHtml(){
  const wk = activeWorkout();
  if(!wk) return `<div class="empty">Nenhum treino.<br><br><button class="btn btn-primary" onclick="addWorkout()">+ Criar treino</button></div>`;
  const inSession = state.session && state.session.workoutId === wk.id;
  
  let header = inSession ? `
    <div class="wk-header">
      <div><h2>${wk.name}</h2><div class="wk-meta">Treino em andamento</div></div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="cancelSession()">Cancelar</button></div>
    </div>` : `
    <div class="wk-header">
      <div><h2>${wk.name}</h2><div class="wk-meta">${wk.exercises.length} exercícios</div></div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="state.editMode=!state.editMode;render()">${state.editMode?'Concluir':'Editar'}</button>
        ${!state.editMode ? `<button class="btn btn-primary btn-sm" onclick="startSession(activeWorkout())">Iniciar</button>` : ''}
      </div>
    </div>`;

  const doneSet = inSession ? musclesDoneInSession() : new Set();
  const lit = new Set(); wk.exercises.forEach(e => lit.add(e.muscle));
  const stripHtml = `<div class="muscle-strip">` + MUSCLE_LIST.filter(m=>lit.has(m)).map(m => {
    const color = MUSCLES[m];
    return `<span class="mtag lit ${doneSet.has(m)?'done':''}" style="background:${color}22;color:${color};border-color:${color}55">${m}</span>`;
  }).join('') + `</div>`;

  const cards = wk.exercises.map((ex,i) => {
    const color = MUSCLES[ex.muscle] || '#888';
    let statusHtml = '';
    if(inSession){
       const entry = state.session.entries[ex.id];
       const doneCount = entry.sets.filter(s=>s.done).length;
       const totalSets = entry.sets.length;
       statusHtml = `<div class="ex-status ${doneCount===totalSets?'active':''}">${doneCount}/${totalSets} séries</div>`;
    }
    
    let editControls = '';
    if(state.editMode && !inSession){
      editControls = `
      <div style="display:flex; gap:6px; margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="event.stopPropagation(); moveExercise(activeWorkout(),${i},-1)">↑ Subir</button>
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="event.stopPropagation(); moveExercise(activeWorkout(),${i},1)">↓ Descer</button>
        <button class="btn btn-danger btn-sm" style="flex:1;" onclick="event.stopPropagation(); deleteExercise(activeWorkout(),${i})">✕ Excluir</button>
      </div>`;
    }

    const bgImg = ex.image ? `background-image:url('${ex.image}');` : '';
    const noteHtml = ex.note ? ` · <em>${ex.note}</em>` : '';
    
    return `
    <div class="ex-card" onclick="openExercise('${ex.id}')" style="${state.editMode?'cursor:default':''}">
      <div class="ex-card-main">
        <div class="ex-thumb" style="${bgImg}"></div>
        <div class="ex-info">
          <div class="ex-name"><span class="ex-idx">${i+1}</span>${ex.name}</div>
          <div class="ex-equip">${ex.equipment || 'Livre/Máquina'}</div>
          <div class="ex-target"><span class="mdot" style="background:${color}"></span>${ex.muscle} · ${ex.sets}x${ex.reps} · ${ex.weight}kg alvo${noteHtml}</div>
        </div>
        ${statusHtml}
      </div>
      ${editControls}
    </div>`;
  }).join('');

  const editExtra = (state.editMode && !inSession) ? addExerciseFormHtml() + `<button class="btn btn-danger" style="margin-top:14px;width:100%" onclick="deleteWorkout('${wk.id}')">Excluir treino completo</button>` : '';
  const finishBar = inSession ? `<div class="finish-bar"><button class="btn btn-primary" onclick="finishSession()">Finalizar treino</button></div>` : '';
  
  return header + stripHtml + cards + editExtra + finishBar;
}

// VIEW 2: TELA DE DETALHE DO EXERCÍCIO
function exercicioViewHtml(){
  const wk = activeWorkout();
  const ex = wk.exercises.find(e => e.id === state.activeExerciseId);
  if(!ex) return '';
  const inSession = state.session && state.session.workoutId === wk.id;
  const color = MUSCLES[ex.muscle] || '#888';
  
  // Imagem
  const bgImg = ex.image ? `background-image:url('${ex.image}');` : '';
  
  // Abas de Conteúdo
  let tabContentHtml = '';
  if(state.activeTab === 'execucao'){
    tabContentHtml = ex.execution ? ex.execution : 'Instruções de execução não cadastradas para este exercício.';
  } else if(state.activeTab === 'musculo'){
    tabContentHtml = `<span class="mdot" style="background:${color}"></span><b>Músculo alvo primário:</b> ${ex.muscle}`;
  } else if(state.activeTab === 'video'){
    if(ex.video){
      tabContentHtml = `<div class="video-container"><iframe src="${ex.video}" allowfullscreen></iframe></div>`;
    } else {
      tabContentHtml = `Nenhum vídeo cadastrado. <br><br><a href="https://www.youtube.com/results?search_query=como+fazer+${encodeURIComponent(ex.name)}" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:bold;">Pesquisar tutorial no YouTube ↗</a>`;
    }
  }

  // Séries (Interativas)
  let setsHtml = '';
  if(inSession){
    const entry = state.session.entries[ex.id];
    const firstPendingIdx = entry.sets.findIndex(s => !s.done);
    
    setsHtml = `<h3>Registrar Séries</h3><div class="setgrid">` + entry.sets.map((st, si) => {
      const isNext = si === firstPendingIdx;
      return `
      <div class="setrow ${isNext ? 'active-set' : ''}">
        <div class="slabel">${si+1}</div>
        <input type="number" inputmode="decimal" value="${st.weight}" placeholder="kg" onchange="updateSetField('${ex.id}',${si},'weight',this.value)">
        <input type="number" inputmode="numeric" value="${st.reps}" placeholder="${ex.unit==='seg' ? 'seg' : 'reps'}" onchange="updateSetField('${ex.id}',${si},'reps',this.value)">
        <button class="donebtn ${st.done?'done':''}" onclick="toggleSet('${ex.id}',${si})">${st.done?'✓':''}</button>
      </div>`;
    }).join('') + `</div>`;
  } else {
    setsHtml = `<div style="text-align:center;color:var(--text-dim);margin:20px 0;font-size:13px;">Inicie o treino na tela anterior para registrar as cargas e repetições.</div>`;
  }

  return `
    <div class="ex-detail-header">
      <div class="btn-back" onclick="closeExercise()">←</div>
      <h2 style="margin:0;font-size:18px;">${ex.name}</h2>
    </div>
    <div class="ex-detail-img" style="${bgImg}"></div>
    
    <div class="tabs">
      <div class="tab ${state.activeTab==='execucao'?'active':''}" onclick="setTab('execucao')">Execução</div>
      <div class="tab ${state.activeTab==='musculo'?'active':''}" onclick="setTab('musculo')">Músculo</div>
      <div class="tab ${state.activeTab==='video'?'active':''}" onclick="setTab('video')">Vídeo</div>
    </div>
    <div class="tab-content">${tabContentHtml}</div>
    
    ${setsHtml}
    
    <div style="height:60px"></div>
  `;
}

// VIEW 3: HISTÓRICO
function historyViewHtml(){
  if(state.sessions.length === 0) return `<div class="empty">Nenhum treino registrado.</div>`;
  return state.sessions.map((s, idx) => {
    return `
    <div class="sess-card">
      <div class="sess-top"><div class="sess-date">${s.workoutName}</div><div class="wk-meta">${new Date(s.startedAt).toLocaleDateString('pt-BR')}</div></div>
      <div class="sess-stats">${s.finishedAt ? Math.round((s.finishedAt - s.startedAt)/60000) + ' min' : '—'}</div>
    </div>`;
  }).join('');
}

function render(){
  let content = '';
  let chips = '';
  
  if(state.view === 'exercicio') {
    content = exercicioViewHtml();
  } else {
    chips = state.workouts.map(w => `<div class="wchip ${w.id===state.activeWorkoutId && !state.session ? 'active':''}" onclick="if(!state.session){state.activeWorkoutId='${w.id}';state.editMode=false;render();}">${w.name}</div>`).join('')
      + `<div class="wchip add" onclick="if(!state.session) addWorkout()">+ Novo Treino</div>`;
    
    content = state.view==='treino' ? `<div class="chip-row">${chips}</div>` + treinoViewHtml() : `<div class="section-label">Sessões anteriores</div>` + historyViewHtml();
  }

  const html = `
    ${state.view !== 'exercicio' ? `
    <div class="topbar">
      <h1>Treino<span>Log</span></h1>
      <div class="view-toggle">
        <button class="${state.view==='treino'?'active':''}" onclick="state.view='treino';render()">Treino</button>
        <button class="${state.view==='historico'?'active':''}" onclick="state.view='historico';render()">Histórico</button>
      </div>
    </div>` : ''}
    ${content}
    <div id="timer-slot">${timerBarHtml()}</div>
  `;
  
  document.getElementById('app').innerHTML = html;
  attachTimerEvents();
}

loadData();
</script>
</body>
</html>
