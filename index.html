<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Log</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#121314; --surface:#1c1d20; --surface-2:#232427; --border:#2c2e33; --text:#f2f1ed; --text-dim:#8b8d93; --accent:#d4ff3f; --accent-dim:#8a9b2c; --done:#c9a227; --danger:#c4453a; --radius:14px; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding-bottom:110px;}
  h1,h2{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  #app{max-width:520px;margin:0 auto;padding:16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{ border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600; font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer; }
  .view-toggle button.active{background:var(--accent);color:#14150f;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .wchip{ flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface); border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer; }
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .ex-card{ background:var(--surface);border:1px solid var(--border);border-radius:var(--radius); padding:14px;margin-bottom:10px; }
  .ex-name{font-family:'Oswald';font-size:16px;font-weight:600;}
  .ex-equip{color:var(--accent);font-size:11px;text-transform:uppercase;font-weight:700;margin-top:2px;}
  .ex-target{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .btn{ border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer; }
  .btn-primary{background:var(--accent);color:#14150f;}
  .setrow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:7px;align-items:center;margin-top:8px;}
  .donebtn{ width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2); color:var(--text-dim);cursor:pointer; }
  .donebtn.done{background:var(--done);color:#181400;}
  .timer-bar{ position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--accent); padding:14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// --- CORE DO SEU APP ---
const storage = {
  async get(key) { if (typeof window.storage !== 'undefined') return await window.storage.get(key); return { value: localStorage.getItem(key) }; },
  async set(key, value) { if (typeof window.storage !== 'undefined') return await window.storage.set(key, value); localStorage.setItem(key, value); }
};

let state = { workouts: [], activeWorkoutId: null, session: null, view: 'treino' };

function getFullWorkouts() {
  return [
    { id: '1', name:'Day 1 · Superior', exercises: [ {name:'Supino Reto com Barra', muscle:'Peito', equip:'BARRA, BANCO RETO', sets:4, reps:10, weight:42}, {name:'Puxada Aberta', muscle:'Costas', equip:'POLIA', sets:4, reps:10, weight:44}, {name:'Remada Serrote', muscle:'Costas', equip:'HALTERES, BANCO', sets:4, reps:10, weight:44}, {name:'Crucifixo Máquina', muscle:'Peito', equip:'MÁQUINA', sets:4, reps:10, weight:44}, {name:'Elevação Lateral', muscle:'Ombro', equip:'HALTERES', sets:4, reps:10, weight:16}, {name:'Rosca Scott', muscle:'Bíceps', equip:'BARRA W', sets:4, reps:10, weight:22}, {name:'Tríceps Corda', muscle:'Tríceps', equip:'POLIA', sets:4, reps:10, weight:22}, {name:'Abd Polia', muscle:'Abdômen', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Abd Infra', muscle:'Abdômen', equip:'PARALELA', sets:4, reps:10, weight:0}, {name:'Prancha', muscle:'Abdômen', equip:'SOLO', sets:4, reps:30, weight:0} ] },
    { id: '2', name:'Day 2 · Inferior', exercises: [ {name:'Leg Press 45', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Terra Smith', muscle:'Perna', equip:'SMITH', sets:4, reps:10, weight:0}, {name:'Stiff Barra', muscle:'Perna', equip:'BARRA', sets:4, reps:10, weight:0}, {name:'Extensora', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Elevação Pélvica', muscle:'Glúteo', equip:'BARRA', sets:4, reps:10, weight:0}, {name:'Ext. Quadril Polia', muscle:'Glúteo', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Adutora', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Panturrilha Leg', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Abd Máquina', muscle:'Abdômen', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Abd Solo', muscle:'Abdômen', equip:'SOLO', sets:4, reps:10, weight:0} ] },
    { id: '3', name:'Day 3 · Empurrar', exercises: [ {name:'Supino Inclinado', muscle:'Peito', equip:'BARRA', sets:4, reps:10, weight:42}, {name:'Supino Reto Máq', muscle:'Peito', equip:'MÁQUINA', sets:4, reps:10, weight:38}, {name:'Supino Declinado', muscle:'Peito', equip:'MÁQUINA', sets:4, reps:10, weight:42}, {name:'Crucifixo Média', muscle:'Peito', equip:'POLIA', sets:4, reps:10, weight:44}, {name:'Crucifixo Alta', muscle:'Peito', equip:'POLIA', sets:4, reps:10, weight:22}, {name:'Face Pull', muscle:'Ombro', equip:'POLIA', sets:4, reps:10, weight:34}, {name:'Elev. Lateral Polia', muscle:'Ombro', equip:'POLIA', sets:4, reps:10, weight:16}, {name:'Tríceps Barra', muscle:'Tríceps', equip:'POLIA', sets:4, reps:10, weight:22}, {name:'Abd Russo', muscle:'Abdômen', equip:'SOLO', sets:4, reps:10, weight:0}, {name:'Prancha Lateral', muscle:'Abdômen', equip:'SOLO', sets:4, reps:10, weight:0} ] },
    { id: '4', name:'Day 4 · Puxar', exercises: [ {name:'Remada Curvada', muscle:'Costas', equip:'BARRA', sets:4, reps:10, weight:0}, {name:'Remada Aberta', muscle:'Costas', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Puxada por Trás', muscle:'Costas', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Puxada Triângulo', muscle:'Costas', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Pullover', muscle:'Costas', equip:'HALTERES', sets:4, reps:10, weight:0}, {name:'Desenv. Máq', muscle:'Ombro', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Desenv. Neutro', muscle:'Ombro', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Rosca Direta', muscle:'Bíceps', equip:'BARRA', sets:4, reps:10, weight:0}, {name:'Encolhimento', muscle:'Trapézio', equip:'SMITH', sets:4, reps:10, weight:0}, {name:'Ext. Punho', muscle:'Antebraço', equip:'BARRA', sets:4, reps:10, weight:0} ] },
    { id: '5', name:'Day 5 · Pernas', exercises: [ {name:'Elevação Pélvica', muscle:'Glúteo', equip:'BARRA', sets:4, reps:10, weight:0}, {name:'Terra Halteres', muscle:'Perna', equip:'HALTERES', sets:4, reps:10, weight:0}, {name:'Avanço Halteres', muscle:'Perna', equip:'HALTERES', sets:4, reps:10, weight:0}, {name:'Stiff Halteres', muscle:'Perna', equip:'HALTERES', sets:4, reps:10, weight:0}, {name:'Mesa Flexora', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Panturrilha Sentado', muscle:'Perna', equip:'MÁQUINA', sets:4, reps:10, weight:0}, {name:'Panturrilha Smith', muscle:'Perna', equip:'SMITH', sets:4, reps:10, weight:0}, {name:'Abdução Quadril', muscle:'Glúteo', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Prancha Lateral', muscle:'Abdômen', equip:'SOLO', sets:4, reps:10, weight:0}, {name:'Abd Polia', muscle:'Abdômen', equip:'POLIA', sets:4, reps:10, weight:0}, {name:'Abd Infra Paralela', muscle:'Abdômen', equip:'PARALELA', sets:4, reps:10, weight:0} ] }
  ];
}

async function loadData(){
  const res = await storage.get('app-data');
  if(res && res.value){
    const parsed = JSON.parse(res.value);
    state.workouts = parsed.workouts || getFullWorkouts();
  } else {
    state.workouts = getFullWorkouts();
    await storage.set('app-data', JSON.stringify({workouts: state.workouts}));
  }
  state.activeWorkoutId = state.workouts[0].id;
  render();
}

function render(){
  const wk = state.workouts.find(w => w.id === state.activeWorkoutId);
  const chips = state.workouts.map(w => `<div class="wchip ${w.id===state.activeWorkoutId ? 'active':''}" onclick="state.activeWorkoutId='${w.id}';render()">${w.name}</div>`).join('');
  const cards = wk.exercises.map(ex => `
    <div class="ex-card">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-equip">${ex.equip}</div>
      <div class="ex-target">${ex.muscle} · ${ex.sets}x${ex.reps} · ${ex.weight}kg</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="topbar"><h1>TreinoLog</h1><button class="btn btn-primary">Iniciar</button></div>
    <div class="chip-row">${chips}</div>
    <h2>${wk.name}</h2>
    ${cards}
  `;
}
loadData();
</script>
</body>
</html>
