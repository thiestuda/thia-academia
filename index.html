<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treino Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121314; --surface:#1c1d20; --surface-2:#232427; --border:#2c2e33;
    --text:#f2f1ed; --text-dim:#8b8d93; --accent:#d4ff3f; --accent-dim:#8a9b2c;
    --done:#c9a227; --danger:#c4453a; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:110px;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
  .tabular{font-variant-numeric:tabular-nums;}
  #app{max-width:520px;margin:0 auto;padding:16px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h1{font-size:22px;margin:0;color:var(--text);}
  .topbar h1 span{color:var(--accent);}
  .view-toggle{display:flex;background:var(--surface);border-radius:100px;padding:3px;border:1px solid var(--border);}
  .view-toggle button{border:none;background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600;font-size:12px;padding:7px 13px;border-radius:100px;cursor:pointer;}
  .view-toggle button.active{background:var(--accent);color:#14150f;}

  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .wchip{flex:0 0 auto;padding:9px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
  .wchip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .wchip.add{color:var(--accent);border-color:var(--accent-dim);}

  .muscle-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .mtag{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:7px;text-transform:uppercase;letter-spacing:0.02em;opacity:0.35;border:1px solid transparent;}
  .mtag.lit{opacity:1;}
  .mtag.done{outline:2px solid var(--done);outline-offset:1px;}

  .wk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .wk-header h2{font-size:19px;margin:0;}
  .wk-meta{color:var(--text-dim);font-size:12px;margin-top:2px;font-family:'Inter';text-transform:none;letter-spacing:0;}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';}
  .btn-primary{background:var(--accent);color:#14150f;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-sm{padding:6px 11px;font-size:11px;border-radius:8px;}
  .btn-row{display:flex;gap:8px;}

  .ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;transition:background 0.15s;}
  .ex-card:active{background:var(--surface-2);}
  .ex-card-main{display:flex;gap:12px;align-items:center;width:100%;}
  .ex-thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ex-info{flex:1;min-width:0;}
  .ex-name{font-family:'Oswald';font-size:15px;text-transform:none;letter-spacing:0;font-weight:600;}
  .ex-idx{color:var(--text-dim);font-size:12px;font-weight:700;margin-right:7px;}
  .ex-target{color:var(--text-dim);font-size:11.5px;margin-top:4px;line-height:1.4;}
  .ex-equip{color:var(--text-dim);font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;margin-top:2px;opacity:0.75;}
  .mdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;}
  .ex-status{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-dim);white-space:nowrap;}
  .ex-status.active{background:var(--done);color:#181400;}

  .ex-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .btn-back{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:100px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;flex-shrink:0;}
  .ex-detail-img{width:100%;height:150px;border-radius:var(--radius);background:var(--surface);display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid var(--border);}

  .tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:12px;border:1px solid var(--border);}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;border-radius:8px;}
  .tab.active{background:var(--surface-2);color:var(--text);}
  .tab-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:13.5px;line-height:1.55;color:var(--text);margin-bottom:20px;min-height:60px;}
  .video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;}
  .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

  .setgrid{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:7px;align-items:center;}
  .setrow .slabel{color:var(--text-dim);font-size:12px;font-weight:700;}
  .setrow input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 6px;font-size:15px;text-align:center;font-family:'Inter';font-weight:600;}
  .setrow input:focus{outline:1px solid var(--accent);}
  .setrow.active-set input{border-color:var(--accent);}
  .donebtn{width:42px;height:42px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:18px;cursor:pointer;font-weight:bold;}
  .donebtn.done{background:var(--done);color:#181400;border-color:var(--done);}
  .addset-btn{width:100%;background:var(--surface-2);border:1px dashed var(--border);color:var(--text-dim);border-radius:9px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:16px;}

  .finish-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:10;}
  .finish-bar .btn{flex:1;}

  .add-ex-form{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-top:6px;}
  .add-ex-form input,.add-ex-form select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:8px;font-family:'Inter';}
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .timer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--accent);padding:14px 18px;display:flex;align-items:center;gap:16px;z-index:20;}
  .ring{width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) calc(var(--pct)*1%),var(--surface-2) 0);}
  .ring-inner{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:14px;font-weight:600;}
  .timer-info{flex:1;}
  .timer-info .lbl{color:var(--text-dim);font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;}
  .timer-info .time{font-family:'Oswald';font-size:26px;line-height:1.1;}
  .timer-actions{display:flex;gap:6px;}
  .timer-actions button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;}

  .sess-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;}
  .sess-top{display:flex;justify-content:space-between;align-items:baseline;}
  .sess-date{font-family:'Oswald';font-size:15px;}
  .sess-stats{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .sess-detail{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:none;}
  .sess-detail.open{display:block;}
  .sess-ex-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-dim);}
  .sess-ex-row b{color:var(--text);font-weight:600;}
  .delta{font-weight:700;margin-left:6px;}
  .delta.up{color:#7bd88f;}
  .delta.down{color:var(--danger);}
  .delta.eq{color:var(--text-dim);}

  .empty{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:13px;}
  .section-label{color:var(--text-dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 8px;}
  .save-warning{background:#3a1f1f;border:1px solid var(--danger);color:#ffb4ac;padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.4;}
</style>
</head>

function buildExecutionLookup(){
  const lookup = {};
  defaultWorkouts().forEach(function(w){ w.exercises.forEach(function(e){ lookup[e.name] = e.execution; }); });
  return lookup;
}

let state = {
  workouts: [], sessions: [], activeWorkoutId: null, view: 'treino',
  activeExerciseId: null, activeTab: 'execucao', editMode: false,
  session: null, openHistoryId: null, saveError: false, lastSaveErrorMsg: '',
  timer: { running:false, remaining:0, total:0, tickHandle:null, done:false }
};

async function loadData(){
  try{
    const res = await window.storage.get('app-data', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.workouts = (parsed.workouts && parsed.workouts.length) ? parsed.workouts : defaultWorkouts();
      state.sessions = parsed.sessions || [];
    } else {
      state.workouts = defaultWorkouts();
      state.sessions = [];
    }
  }catch(e){
    state.workouts = defaultWorkouts();
    state.sessions = [];
  }

  const lookup = buildExecutionLookup();
  state.workouts.forEach(function(w){ w.exercises.forEach(function(ex){
    if(!ex.execution) ex.execution = lookup[ex.name] || '';
    if(!ex.unit) ex.unit = 'reps';
    if(!ex.equipment) ex.equipment = 'Livre/Máquina';
    if(ex.video === undefined) ex.video = '';
    delete ex.image;
  }); });

  if(!state.workouts.some(function(w){ return w.name === 'Day 6 · Pump'; })){
    state.workouts.push(pumpWorkoutTemplate());
  }

  await saveData();

  state.activeWorkoutId = state.workouts[0] ? state.workouts[0].id : null;

  try{
    const cur = await window.storage.get('current-session', false);
    if(cur && cur.value){
      state.session = JSON.parse(cur.value);
      state.activeWorkoutId = state.session.workoutId;
    }
  }catch(e){ }

  render();
}

async function storageSet(key, value){
  try{
    const res = await window.storage.set(key, value, false);
    state.saveError = false;
    state.lastSaveErrorMsg = '';
    return res;
  }catch(e){
    console.error('storage set failed', e);
    state.lastSaveErrorMsg = (e && e.message) ? e.message : String(e);
    state.saveError = true;
    renderSaveWarningOnly();
    return null;
  }
}
async function saveData(){
  await storageSet('app-data', JSON.stringify({workouts: state.workouts, sessions: state.sessions}));
}
async function saveSession(){
  if(state.session) await storageSet('current-session', JSON.stringify(state.session));
}
async function clearSessionStorage(){
  try{ await window.storage.delete('current-session', false); }catch(e){ }
}
function retrySave(){
  saveData();
  if(state.session) saveSession();
}
function renderSaveWarningOnly(){
  const el = document.getElementById('save-warning-slot');
  if(el) el.innerHTML = saveWarningHtml();
}
function saveWarningHtml(){
  if(!state.saveError) return '';
  return '<div class="save-warning">⚠️ O salvamento automático não está funcionando neste ambiente. Use "Copiar backup" com frequência para não perder dados.'
    + (state.lastSaveErrorMsg ? ('<br><span style="opacity:0.65;font-size:10px;">'+state.lastSaveErrorMsg+'</span>') : '')
    + '<div style="display:flex;gap:6px;margin-top:8px;">'
    + '<button class="btn btn-sm" style="background:var(--danger);color:#fff;flex:1;" onclick="retrySave()">Tentar salvar</button>'
    + '<button class="btn btn-sm btn-ghost" style="flex:1;" onclick="exportBackup()">Copiar backup</button>'
    + '</div></div>';
}
function exportBackup(){
  const payload = JSON.stringify({workouts: state.workouts, sessions: state.sessions});
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      alert('Backup copiado! Cole em um bloco de notas (Notas, WhatsApp pra você mesmo, etc.) pra guardar. Quando quiser restaurar, use "Importar backup" e cole o texto de volta.');
    }).catch(function(){
      window.prompt('Não consegui copiar automaticamente. Selecione e copie o texto abaixo (Ctrl/Cmd+A, depois Ctrl/Cmd+C):', payload);
    });
  } else {
    window.prompt('Selecione e copie o texto abaixo (Ctrl/Cmd+A, depois Ctrl/Cmd+C):', payload);
  }
}
function importBackup(){
  const pasted = window.prompt('Cole aqui o texto do backup que você copiou antes:');
  if(!pasted) return;
  try{
    const parsed = JSON.parse(pasted);
    if(!parsed.workouts) throw new Error('formato inválido');
    state.workouts = parsed.workouts;
    state.sessions = parsed.sessions || [];
    alert('Backup restaurado! Vou tentar salvar automaticamente também, mas seus dados já estão aqui na tela.');
    saveData();
    render();
  }catch(e){
    alert('Não consegui ler esse backup. Confira se colou o texto completo.');
  }
}

  const s = new Set();

    const entry = state.session.entries[ex.id];
    if(entry && entry.sets.some(function(st){return st.done;})) s.add(ex.muscle);

  return s;
}

function startSession(wk){
  const entries = {};
  wk.exercises.forEach(function(ex){
    entries[ex.id] = { sets: Array.from({length: ex.sets || 1}, function(){ return {weight: ex.weight, reps: ex.reps, done:false}; }) };
  });
  state.session = { id: uid(), workoutId: wk.id, workoutName: wk.name, startedAt: Date.now(), finishedAt: null, entries: entries };
  state.editMode = false;
  saveSession(); render();
}
function toggleSet(exId, setIdx){
  if(!state.session) return;
  const entry = state.session.entries[exId];
  const st = entry.sets[setIdx];
  st.done = !st.done;

  if(st.done){
    const wk = activeWorkout();
    const exIndex = wk.exercises.findIndex(function(e){ return e.id === exId; });
    const ex = wk.exercises[exIndex];
    startTimer(ex ? (ex.rest || 60) : 60);

    const allDone = entry.sets.every(function(s){ return s.done; });
    if(allDone && exIndex < wk.exercises.length - 1){
      const nextEx = wk.exercises[exIndex + 1];
      setTimeout(function(){
        if(state.view === 'exercicio' && state.activeExerciseId === exId){
          openExercise(nextEx.id);
        }
      }, 700);
    } else if(allDone){
      setTimeout(function(){ alert('Todos os exercícios concluídos! Toque em "Finalizar treino" para salvar.'); }, 700);
    }
  }
  saveSession(); render();
}
function updateSetField(exId, setIdx, field, value){
  const st = state.session.entries[exId].sets[setIdx];
  st[field] = value === '' ? 0 : Number(value);
  saveSession();
}
function addSet(exId){
  if(!state.session) return;
  const entry = state.session.entries[exId];
  const last = entry.sets[entry.sets.length - 1];
  entry.sets.push({weight: last ? last.weight : 0, reps: last ? last.reps : 10, done:false});
  saveSession(); render();
}
async function finishSession(){
  if(!state.session) return;
  state.session.finishedAt = Date.now();
  const wk = state.workouts.find(function(w){ return w.id === state.session.workoutId; });
  if(wk){
    wk.exercises.forEach(function(ex){
      const entry = state.session.entries[ex.id];
      if(entry){
        const done = entry.sets.filter(function(s){return s.done;}).map(function(s){return s.weight;});
        const maxW = done.length ? Math.max.apply(null, done) : 0;
        if(maxW > 0) ex.weight = maxW;
      }
    });
  }
  state.sessions.unshift(state.session);
  if(state.sessions.length > 200) state.sessions.length = 200;
  await saveData();
  state.session = null;
  stopTimer();
  await clearSessionStorage();
  state.view = 'treino';
  render();
}
function cancelSession(){
  state.session = null; stopTimer(); clearSessionStorage(); state.view='treino'; render();
}

}
function closeExercise(){
  state.activeExerciseId = null;
  state.view = 'treino';
  render();
}
function setTab(tab){ state.activeTab = tab; render(); }

let audioCtx = null;
function beep(freq, dur){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur/1000);
  }catch(e){ }
}
function timerTick(){
  state.timer.remaining -= 1;
  if(state.timer.remaining <= 0){
    state.timer.remaining = 0; state.timer.running = false; state.timer.done = true;
    clearInterval(state.timer.tickHandle);
    beep(880,150); setTimeout(function(){beep(880,150);},220); setTimeout(function(){beep(1100,220);},440);
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  renderTimerOnly();
}
function startTimer(seconds){
  stopTimer();
  state.timer.total = seconds; state.timer.remaining = seconds; state.timer.running = true; state.timer.done = false;
  state.timer.tickHandle = setInterval(timerTick, 1000);
  render();
}
function adjustTimer(delta){
  if(!state.timer.total && !state.timer.remaining) return;
  state.timer.remaining = Math.max(0, state.timer.remaining + delta);
  state.timer.total = Math.max(state.timer.total, state.timer.remaining);
  renderTimerOnly();
}
function togglePauseTimer(){
  if(state.timer.done) return;
  if(state.timer.running){ state.timer.running = false; clearInterval(state.timer.tickHandle); }
  else if(state.timer.remaining > 0){ state.timer.running = true; state.timer.tickHandle = setInterval(timerTick, 1000); }
  renderTimerOnly();
}
function stopTimer(){
  if(state.timer.tickHandle) clearInterval(state.timer.tickHandle);
  state.timer = { running:false, remaining:0, total:0, tickHandle:null, done:false };
}
function dismissTimer(){ stopTimer(); render(); }

function findPrevSession(exId, beforeIdx){
  for(let i = beforeIdx+1; i < state.sessions.length; i++){
    if(state.sessions[i].entries[exId]) return state.sessions[i].entries[exId];
  }
  return null;
}
function maxWeight(entry){
  const done = entry.sets.filter(function(s){return s.done;}).map(function(s){return s.weight;});
  return done.length ? Math.max.apply(null, done) : 0;
}
function toggleHistoryOpen(id){ state.openHistoryId = state.openHistoryId === id ? null : id; render(); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDuration(ms){ return Math.round(ms/60000) + ' min'; }

function renderTimerOnly(){
  const el = document.getElementById('timer-slot');
  if(el) el.innerHTML = timerBarHtml();
  attachTimerEvents();
}
function attachTimerEvents(){
  document.querySelectorAll('[data-timer-action]').forEach(function(btn){
    btn.onclick = function(){
      const act = btn.getAttribute('data-timer-action');
      if(act==='minus') adjustTimer(-15);
      if(act==='plus') adjustTimer(15);
      if(act==='pause') togglePauseTimer();
      if(act==='dismiss') dismissTimer();
    };
  });
}
function timerBarHtml(){
  if(!state.timer.total && !state.timer.remaining && !state.timer.done) return '';
  const pct = state.timer.total ? Math.round(100 * (state.timer.total - state.timer.remaining) / state.timer.total) : 100;
  const mm = String(Math.floor(state.timer.remaining/60)).padStart(2,'0');
  const ss = String(state.timer.remaining%60).padStart(2,'0');
  const label = state.timer.done ? 'Descanso concluído' : (state.timer.running ? 'Descansando' : 'Pausado');
  return '<div class="timer-bar"><div class="ring" style="--pct:'+pct+'"><div class="ring-inner tabular">'+mm+':'+ss+'</div></div>'
    + '<div class="timer-info"><div class="lbl">'+label+'</div><div class="time tabular">'+mm+':'+ss+'</div></div>'
    + '<div class="timer-actions">'
    + (state.timer.done ? '<button data-timer-action="dismiss">OK</button>' :
       '<button data-timer-action="minus">-15</button><button data-timer-action="pause">'+(state.timer.running?'Pausar':'Retomar')+'</button><button data-timer-action="plus">+15</button><button data-timer-action="dismiss">Pular</button>')
    + '</div></div>';
}

function treinoViewHtml(){
  const wk = activeWorkout();
  if(!wk) return '<div class="empty">Nenhum treino ainda.<br><br><button class="btn btn-primary" onclick="addWorkout()">+ Criar treino</button></div>';
  const inSession = state.session && state.session.workoutId === wk.id;

  const header = inSession ?
    '<div class="wk-header"><div><h2>'+wk.name+'</h2><div class="wk-meta">Treino em andamento</div></div>'
    + '<div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="cancelSession()">Cancelar</button></div></div>' :
    '<div class="wk-header"><div><h2>'+wk.name+'</h2><div class="wk-meta">'+wk.exercises.length+' exercícios'+(wk.note?(' · '+wk.note):'')+'</div></div>'
    + '<div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="state.editMode=!state.editMode;render()">'+(state.editMode?'Concluir':'Editar')+'</button>'
    + (!state.editMode ? '<button class="btn btn-primary btn-sm" onclick="startSession(activeWorkout())">Iniciar</button>' : '') + '</div></div>';

  const doneSet = inSession ? musclesDoneInSession() : new Set();
  const lit = new Set(); wk.exercises.forEach(function(e){ lit.add(e.muscle); });
  const stripHtml = '<div class="muscle-strip">' + MUSCLE_LIST.filter(function(m){return lit.has(m);}).map(function(m){
    const color = MUSCLES[m];
    return '<span class="mtag lit '+(doneSet.has(m)?'done':'')+'" style="background:'+color+'22;color:'+color+';border-color:'+color+'55">'+m+'</span>';
  }).join('') + '</div>';

  const cards = wk.exercises.map(function(ex,i){
    const color = MUSCLES[ex.muscle] || '#888';
    let statusHtml = '';
    if(inSession){
      const entry = state.session.entries[ex.id];
      const doneCount = entry.sets.filter(function(s){return s.done;}).length;
      statusHtml = '<div class="ex-status '+(doneCount===entry.sets.length?'active':'')+'">'+doneCount+'/'+entry.sets.length+'</div>';
    }
    let editControls = '';
    if(state.editMode && !inSession){
      editControls = '<div style="display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">'
        + '<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="event.stopPropagation();moveExercise(activeWorkout(),'+i+',-1)">↑ Subir</button>'
        + '<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="event.stopPropagation();moveExercise(activeWorkout(),'+i+',1)">↓ Descer</button>'
        + '<button class="btn btn-danger btn-sm" style="flex:1;" onclick="event.stopPropagation();deleteExercise(activeWorkout(),'+i+')">✕ Excluir</button></div>';
    }
    const noteHtml = ex.note ? ' · <em>'+ex.note+'</em>' : '';
    const unitLabel = ex.unit === 'seg' ? 'seg' : '';
    return '<div class="ex-card" onclick="openExercise(\''+ex.id+'\')" style="'+(state.editMode?'cursor:default':'')+'">'
      + '<div class="ex-card-main"><div class="ex-thumb" style="background:'+color+'18;">'+muscleIconSvg(ex.muscle, 34)+'</div>'
      + '<div class="ex-info"><div class="ex-name"><span class="ex-idx">'+(i+1)+'</span>'+ex.name+'</div>'
      + '<div class="ex-equip">'+ex.equipment+'</div>'
      + '<div class="ex-target"><span class="mdot" style="background:'+color+'"></span>'+ex.muscle+' · '+ex.sets+'x'+ex.reps+unitLabel+(ex.weight?(' · '+ex.weight+'kg alvo'):'')+noteHtml+'</div></div>'
      + statusHtml + '</div>' + editControls + '</div>';
  }).join('');

  const editExtra = (state.editMode && !inSession) ? addExerciseFormHtml() + '<button class="btn btn-danger" style="margin-top:14px;width:100%" onclick="deleteWorkout(\''+wk.id+'\')">Excluir treino completo</button>' : '';
  const finishBar = inSession ? '<div class="finish-bar"><button class="btn btn-primary" onclick="finishSession()">Finalizar treino</button></div>' : '';

  return header + stripHtml + cards + editExtra + finishBar;
}

function exercicioViewHtml(){
  const wk = activeWorkout();
  const ex = wk.exercises.find(function(e){ return e.id === state.activeExerciseId; });
  if(!ex) return '';
  const inSession = state.session && state.session.workoutId === wk.id;
  const color = MUSCLES[ex.muscle] || '#888';

  let tabContentHtml = '';
  if(state.activeTab === 'execucao'){
    tabContentHtml = ex.execution || 'Instruções de execução não cadastradas para este exercício.';
  } else if(state.activeTab === 'musculo'){
    tabContentHtml = '<span class="mdot" style="background:'+color+'"></span><b>Músculo alvo principal:</b> '+ex.muscle;
  } else if(state.activeTab === 'video'){
    if(ex.video){
      tabContentHtml = '<div class="video-container"><iframe src="'+ex.video+'" allowfullscreen></iframe></div>';
    } else {
      const q = encodeURIComponent(ex.name + ' execução técnica');
      tabContentHtml = 'Nenhum vídeo específico cadastrado.<br><br><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;font-weight:bold;">Buscar vídeo curto no YouTube ↗</a>';
    }
  }

  let setsHtml = '';
  if(inSession){
    const entry = state.session.entries[ex.id];
    const firstPendingIdx = entry.sets.findIndex(function(s){ return !s.done; });
    setsHtml = '<h3 style="font-size:14px;margin:0 0 10px;">Registrar séries</h3><div class="setgrid">' + entry.sets.map(function(st, si){
      const isNext = si === firstPendingIdx;
      return '<div class="setrow '+(isNext?'active-set':'')+'"><div class="slabel">'+(si+1)+'</div>'
        + '<input type="number" inputmode="decimal" value="'+st.weight+'" placeholder="kg" onchange="updateSetField(\''+ex.id+'\','+si+',\'weight\',this.value)">'
        + '<input type="number" inputmode="numeric" value="'+st.reps+'" placeholder="'+(ex.unit==='seg'?'seg':'reps')+'" onchange="updateSetField(\''+ex.id+'\','+si+',\'reps\',this.value)">'
        + '<button class="donebtn '+(st.done?'done':'')+'" onclick="toggleSet(\''+ex.id+'\','+si+')">'+(st.done?'✓':'')+'</button></div>';
    }).join('') + '</div><button class="addset-btn" onclick="addSet(\''+ex.id+'\')">+ Adicionar série extra</button>';
  } else {
    setsHtml = '<div style="text-align:center;color:var(--text-dim);margin:16px 0;font-size:13px;">Inicie o treino na tela anterior para registrar cargas e repetições.</div>';
  }

  return '<div class="ex-detail-header"><div class="btn-back" onclick="closeExercise()">←</div><h2 style="margin:0;font-size:17px;text-transform:none;letter-spacing:0;">'+ex.name+'</h2></div>'
    + '<div class="ex-detail-img">'+muscleIconSvg(ex.muscle, 110)+'</div>'
    + '<div class="tabs"><div class="tab '+(state.activeTab==='execucao'?'active':'')+'" onclick="setTab(\'execucao\')">Execução</div>'
    + '<div class="tab '+(state.activeTab==='musculo'?'active':'')+'" onclick="setTab(\'musculo\')">Músculo</div>'
    + '<div class="tab '+(state.activeTab==='video'?'active':'')+'" onclick="setTab(\'video\')">Vídeo</div></div>'
    + '<div class="tab-content">'+tabContentHtml+'</div>' + setsHtml + '<div style="height:50px"></div>';
}

function historyViewHtml(){
  if(state.sessions.length === 0) return '<div class="empty">Nenhum treino registrado ainda.<br>Finalize um treino para ver o histórico aqui.</div>';
  return state.sessions.map(function(s, idx){
    const wk = state.workouts.find(function(w){ return w.id===s.workoutId; });
    const volume = Object.values(s.entries).reduce(function(sum, e){ return sum + e.sets.filter(function(st){return st.done;}).reduce(function(a,st){return a + st.weight*st.reps;},0); }, 0);
    const doneMuscles = new Set();
    if(wk) wk.exercises.forEach(function(ex){ const e=s.entries[ex.id]; if(e && e.sets.some(function(st){return st.done;})) doneMuscles.add(ex.muscle); });
    const open = state.openHistoryId === s.id;
    let detail = '';
    if(open && wk){
      detail = '<div class="sess-detail open">' + wk.exercises.map(function(ex){
        const entry = s.entries[ex.id];
        if(!entry) return '';
        const mw = maxWeight(entry);
        const prev = findPrevSession(ex.id, idx);
        let deltaHtml = '';
        if(prev){
          const pw = maxWeight(prev);
          if(mw > pw) deltaHtml = '<span class="delta up">▲ +'+(mw-pw).toFixed(1)+'kg</span>';
          else if(mw < pw) deltaHtml = '<span class="delta down">▼ '+(mw-pw).toFixed(1)+'kg</span>';
          else deltaHtml = '<span class="delta eq">=</span>';
        }
        return '<div class="sess-ex-row"><span><b>'+ex.name+'</b></span><span>'+mw+'kg'+deltaHtml+'</span></div>';
      }).join('') + '</div>';
    }
    return '<div class="sess-card" onclick="toggleHistoryOpen(\''+s.id+'\')">'
      + '<div class="sess-top"><div class="sess-date">'+s.workoutName+'</div><div class="wk-meta">'+fmtDate(s.startedAt)+'</div></div>'
      + '<div class="sess-stats">'+(s.finishedAt ? fmtDuration(s.finishedAt - s.startedAt) : '—')+' · '+Math.round(volume)+'kg volume total · '+(Array.from(doneMuscles).join(', ') || 'sem sets marcados')+'</div>'
      + detail + '</div>';
  }).join('');
}

function render(){
  let content = '';
  if(state.view === 'exercicio'){
    content = exercicioViewHtml();
  } else {
    const chips = state.workouts.map(function(w){
      return '<div class="wchip '+(w.id===state.activeWorkoutId && !state.session ? 'active':'')+'" onclick="if(!state.session){state.activeWorkoutId=\''+w.id+'\';state.editMode=false;render();}">'+w.name+'</div>';
    }).join('') + '<div class="wchip add" onclick="if(!state.session) addWorkout()">+ Novo</div>';
    content = state.view==='treino'
      ? '<div class="chip-row">'+chips+'</div>' + treinoViewHtml()
      : '<div class="section-label">Sessões anteriores</div>'
        + '<div style="display:flex;gap:8px;margin-bottom:14px;">'
        + '<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="exportBackup()">📋 Copiar backup</button>'
        + '<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="importBackup()">📥 Importar backup</button>'
        + '</div>'
        + historyViewHtml();
  }

  const html = (state.view !== 'exercicio' ?
    '<div class="topbar"><h1>Treino<span>Log</span></h1><div class="view-toggle">'
    + '<button class="'+(state.view==='treino'?'active':'')+'" onclick="state.view=\'treino\';render()">Treino</button>'
    + '<button class="'+(state.view==='historico'?'active':'')+'" onclick="state.view=\'historico\';render()">Histórico</button>'
    + '</div></div>' : '')
    + '<div id="save-warning-slot">'+saveWarningHtml()+'</div>'
    + content + '<div id="timer-slot">'+timerBarHtml()+'</div>';

  document.getElementById('app').innerHTML = html;
  attachTimerEvents();
}

loadData();
</script>
</body>
</html>
